<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="home_background">
    <div class="home_container">

        <div class="home_card">
            <div class="voltar_a_esquerda">
                <a class="voltar" href="/">← Voltar</a>
            </div>

            <h1>Criar Conta</h1>

            <form method="POST">
                <div class="input_group">
                    <input type="text" name="nome" value="{{ valor_nome if valor_nome else '' }}" placeholder="Digite seu nome" required>
                </div>

                <div class="input_group">
                    <input type="email" name="email" value="{{ valor_email if valor_email else '' }}" placeholder="Digite seu e-mail mais importante" required>
                </div>

                <div class="input_group">
                    <div class="senha">
                        <input type="password" id="senha" name="senha" placeholder="Senha" required>
                        <button type="button" onclick="mostrarSenha()">
                            👁
                        </button>
                    </div>
                </div>

                {% if erro %}
                <div class="erro_texto">
                    {{ erro }}
                </div>
                {% endif %}

                <button type="submit">
                    Criar Conta
                </button>
            </form>
        </div>
    </div>

    <script>
        function mostrarSenha() {
            const senha = document.getElementById("senha");

            if (senha.type === "password") {
                senha.type = "text";
            } else {
                senha.type = "password";
            }
        }
    </script>    
</body>

</html>
