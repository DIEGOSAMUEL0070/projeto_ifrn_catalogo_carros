<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="home_background">
    <div class="home_container">

        <div class="home_card">

            <h1>Criar Conta</h1>

            <form method="POST">
                <div class="input_group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" value="{{ valor_nome if valor_nome else '' }}" placeholder="Digite seu nome" required>
                </div>

                <div class="input_group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" value="{{ valor_email if valor_email else '' }}" placeholder="Digite seu e-mail mais importante" required>
                </div>

                <div class="input_group">
                    <label for="senha">Senha:</label>
                    <div class="senha">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                        <button type="button" onclick="mostrarSenha('senha')">
                            👁
                        </button>
                    </div>
                </div>
                
                <div class="input_group">
                    <label for="confirmar_senha">Confirmar senha:</label>
                    <div class="senha">
                        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme sua senha" required>
                        <button type="button" onclick="mostrarSenha('confirmar_senha')">
                            👁
                        </button>
                    </div>
                </div>

                {% if erro %}
                <div class="erro_texto">
                    {{ erro }}
                </div>
                {% endif %}

                <div class="form_footer">
                    <a class="voltar" href="/">← Voltar para a Tela Inicial</a>
                    <button type="submit">Criar Conta</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function mostrarSenha(id) {
            const senha = document.getElementById(id);

            if (senha.type === "password") {
                senha.type = "text";
            } else {
                senha.type = "password";
            }
        }
    </script>    
</body>

</html>
